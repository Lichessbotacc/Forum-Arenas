name: Forum Arena Requests

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten - Nutzer wollen zeitnahe Bestätigung
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-create:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check forum & create arenas
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
        run: python main.py

      - name: Commit state
        run: |
          git config user.name "arena-bot"
          git config user.email "actions@github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "Update processed post state"
          git push
